name: Update Scholar stats

# Scheduled scraping moved to the local Mac (launchd:
# ~/Library/LaunchAgents/com.anyang.scholar-updater.plist, 08:00 daily) —
# Google Scholar 403-blocks GitHub Actions datacenter IPs, so a cron here
# fails every run. workflow_dispatch is kept for occasional manual attempts.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Scholar stats
        run: python scripts/update_scholar.py
      - name: Commit updated data
        run: |
          git config user.name "scholar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily Scholar stats update"
            git push
          fi
